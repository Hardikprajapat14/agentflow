# Render Blueprint - deploys AgentFlow on Render's free tier (API + static frontend + Postgres/pgvector).
# Free-tier trade-offs: the API sleeps after 15 min idle (~1 min wake-up) and the free Postgres expires after 30 days.
databases:
  - name: agentflow-db
    plan: free
    databaseName: agentflow
    user: agentflow

services:
  - type: web
    name: agentflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: agentflow-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_API_KEY
        sync: false                      # paste your free Groq key in the Render dashboard
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ORIGINS
        sync: false                      # your static site URL, e.g. https://agentflow-web.onrender.com
      - key: CELERY_EAGER                # free tier has no background workers -> run jobs inside the API process
        value: "true"
      - key: EMBEDDING_BACKEND           # fits the 512 MB free instance; use "fastembed" on a paid plan
        value: hashing
      - key: PRELOAD_EMBEDDINGS          # skip the model download at build time
        value: "0"
      - key: UPLOAD_DIR
        value: /tmp/agentflow/uploads
      - key: REPORT_DIR
        value: /tmp/agentflow/reports

  - type: web
    name: agentflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false                      # your API URL, e.g. https://agentflow-api.onrender.com
