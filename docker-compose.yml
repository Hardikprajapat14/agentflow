# AgentFlow - everything runs locally, free of cost. Only external dependency: a free Groq API key.
x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://agentflow:agentflow@db:5432/agentflow
    REDIS_URL: redis://redis:6379/0
    CELERY_EAGER: "false"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    <<: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    <<: *backend-env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      backend: { condition: service_healthy }
    volumes: [appdata:/data]
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
